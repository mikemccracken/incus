description: Database instances stay apart through an evacuation
cluster: cluster.yaml
scriptlet: spread.star
steps:
  - name: evacuate node2
    evacuate: {member: node2}
    expect:
      instances:
        db2: {outcome: scriptlet, target: node3}
        cache1: {outcome: stays}
      members:
        node2: {instances: 1}
        "*": {max_instances: 3}
      apart: [db1, db2]

  - name: a third database instance has nowhere to go
    create: {name: db3, type: virtual-machine, profiles: [default, db]}
    expect: {outcome: rejected, error: No cluster member satisfies the placement rules}

  - name: unless the gpu group is requested
    create: {name: db3, type: virtual-machine, profiles: [default, db], target: "@gpu"}
    expect:
      outcome: scriptlet
      target: node4
      apart: [db1, db2, db3]

  - name: a database instance can't join another one
    move: {instance: db1, target: node3}
    expect: {outcome: rejected}

  - name: other instances move freely
    move: {instance: web1, target: "@default"}
    expect:
      target_in: [node1, node3]
      members:
        "*": {max_instances: 3}
